[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo_mysql",
  "php83Packages.composer",
  "nodejs_20"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan filament:assets",
  "php artisan optimize:clear",
  "php artisan config:cache"
]

[start]
cmd = "php -S 0.0.0.0:8000 -t public"

[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo_mysql",
  "php83Packages.composer",
  "mariadb",
  "nodejs_20"
]

[phases.install]
cmds = [
  "composer install",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan key:generate --force || true
php artisan optimize:clear || true
php artisan config:cache || true
php artisan octane:frankenphp --host=0.0.0.0 --port=8000"

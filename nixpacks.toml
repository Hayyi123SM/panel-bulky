[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo_mysql",
  "php82Packages.composer",
  "mariadb",
  "nodejs_20"
]

[phases.install]
cmds = [
  "composer install",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "composer install --no-dev --optimize-autoloader"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=8000"

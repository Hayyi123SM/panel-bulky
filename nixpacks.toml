[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo_mysql",
  "mariadb"
]

[phases.install]
cmds = [
  "composer install --ignore-platform-reqs",
  "npm ci"
]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=8000"
